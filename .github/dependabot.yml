# Weekly updates of the export scripts' Python dependencies and of the workflow's actions.
version: 2
updates:
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
